<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Vinyl Catalogue</title>
  <!-- Home-screen app: name, icon and how it opens (see manifest.webmanifest). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Vinyl">
  <!-- "default" lets iOS colour the status bar from theme-color above, so it
       follows light and dark mode with readable text. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/collection.css">
  <link rel="stylesheet" href="styles/detail.css">
  <link rel="stylesheet" href="styles/form.css">
  <link rel="stylesheet" href="styles/sheet.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app"></main>
  <div id="sheet-root"></div>
</body>
</html>
